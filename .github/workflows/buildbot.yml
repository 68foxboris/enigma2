name: buildbot

on:
  push:
    branches: [ develop ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          ref: 'develop'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Build python 3.14
        run: |
          sudo apt-get -q update
          sudo apt-get install dos2unix
          pip install --upgrade pip autopep8 future
          ./CI/build.sh
